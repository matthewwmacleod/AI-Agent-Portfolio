name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Server (install + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start server and check health endpoint
        run: |
          node index.js &
          server_pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health; then
              echo "Server is up"
              kill "$server_pid"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy in time"
          kill "$server_pid" 2>/dev/null || true
          exit 1
